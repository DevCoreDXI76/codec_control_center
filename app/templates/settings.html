<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>설정 - BridgeX</title>
  <link rel="icon" href="/static/img/favicon.ico" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="/static/js/theme.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <img class="brand-mark" src="/static/img/coredxi-mark.png" alt="coredxi" />
      <span class="brand-word">BridgeX</span>
    </h1>
    <button id="theme-toggle" class="theme-toggle-btn" type="button" title="다크모드 전환">🌙</button>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a href="/">대시보드</a>
      <a class="active" href="/settings">설정</a>
      <a href="/logs">로그</a>
      <a class="sidebar-guide-link" href="/guide">가이드</a>
      <p class="sidebar-version">
        <img class="footer-mark" src="/static/img/coredxi-mark.png" alt="" />
        BridgeX v{{ app_version }} · coredxi 제작
      </p>
    </nav>

    <main class="main">
      <div
        class="settings-panel"
        x-data="{
          poll_interval: {{ settings.poll_interval }},
          max_concurrency: {{ settings.max_concurrency }},
          command_timeout: {{ settings.command_timeout }},
          open_browser_on_start: {{ 'true' if settings.open_browser_on_start else 'false' }},
          teams_tenant_address: {{ settings.teams_tenant_address | tojson | forceescape }},
          saving: false,
          error: '',
          saved: false,
          async submit() {
            this.saving = true;
            this.error = '';
            this.saved = false;
            const resp = await fetch('/api/settings', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                poll_interval: Number(this.poll_interval),
                max_concurrency: Number(this.max_concurrency),
                command_timeout: Number(this.command_timeout),
                open_browser_on_start: this.open_browser_on_start,
                teams_tenant_address: this.teams_tenant_address,
              }),
            });
            this.saving = false;
            if (!resp.ok) {
              const detail = await resp.json().catch(() => ({}));
              this.error = typeof detail.detail === 'string' ? detail.detail : '저장 실패';
              return;
            }
            this.saved = true;
            setTimeout(() => (this.saved = false), 2000);
          },
        }"
      >
        <h2>설정</h2>
        <form @submit.prevent="submit()" class="settings-form">
          <div class="field">
            <label>폴링 주기 (초)</label>
            <input type="number" min="1" max="300" step="1" x-model="poll_interval" required />
          </div>
          <div class="field">
            <label>동시 접속 제한 (대)</label>
            <input type="number" min="1" max="64" step="1" x-model="max_concurrency" required />
          </div>
          <div class="field">
            <label>명령 타임아웃 (초)</label>
            <input type="number" min="1" max="60" step="1" x-model="command_timeout" required />
          </div>
          <div class="field">
            <label>데이터 저장 경로</label>
            <input type="text" value="{{ data_dir }}" readonly />
          </div>
          <div class="field">
            <label class="checkbox-label"><input type="checkbox" x-model="open_browser_on_start" /> 시작 시 자동으로 브라우저 열기</label>
          </div>
          <div class="field">
            <label>Teams 테넌트 주소 (CVI)</label>
            <input type="text" x-model="teams_tenant_address" placeholder="예: vc.example.com" />
            <p class="meta" x-show="!teams_tenant_address" style="color: var(--color-warn)">
              ⚠ 아직 저장된 값이 없습니다 — 위 칸의 회색 글씨는 예시일 뿐, 실제 값이 아닙니다.
              여기에 직접 입력하고 저장을 눌러야 회의ID만으로 다이얼할 수 있습니다.
            </p>
          </div>
          <p class="error-text" x-show="error" x-text="error"></p>
          <p class="meta" x-show="saved" style="color: var(--color-online)">저장되었습니다.</p>
          <div class="modal-actions">
            <button class="btn btn-primary" type="submit" :disabled="saving">저장</button>
          </div>
        </form>
      </div>

      <div
        class="settings-panel"
        x-data="{
          groups: [],
          error: '',
          editingName: null,
          editValue: '',
          async load() {
            const resp = await fetch('/api/groups');
            this.groups = resp.ok ? await resp.json() : [];
          },
          startEdit(g) {
            this.editingName = g.name;
            this.editValue = g.name;
            this.error = '';
          },
          cancelEdit() {
            this.editingName = null;
            this.error = '';
          },
          async saveEdit(oldName) {
            this.error = '';
            const resp = await fetch(`/api/groups/${encodeURIComponent(oldName)}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ new_name: this.editValue }),
            });
            if (!resp.ok) {
              this.error = resp.status === 409 ? '이미 존재하는 그룹명입니다' : '수정 실패';
              return;
            }
            this.editingName = null;
            await this.load();
          },
          async remove(g) {
            if (!confirm(`&quot;${g.name}&quot; 그룹 태그를 ${g.device_count}대 장비에서 제거합니다. 장비 자체는 삭제되지 않습니다. 계속할까요?`)) return;
            const resp = await fetch(`/api/groups/${encodeURIComponent(g.name)}`, { method: 'DELETE' });
            if (resp.ok) {
              await this.load();
            } else {
              this.error = '삭제 실패';
            }
          },
        }"
        x-init="load()"
      >
        <h2>그룹 관리</h2>
        <template x-if="groups.length === 0">
          <p class="meta">등록된 그룹이 없습니다.</p>
        </template>
        <ul class="group-manage-list">
          <template x-for="g in groups" :key="g.name">
            <li class="group-manage-row">
              <template x-if="editingName !== g.name">
                <span x-text="`${g.name} (장비 ${g.device_count}대)`"></span>
              </template>
              <template x-if="editingName === g.name">
                <input type="text" x-model="editValue" />
              </template>
              <span class="group-manage-actions">
                <template x-if="editingName !== g.name">
                  <button class="btn" type="button" @click="startEdit(g)" title="이름 수정">✎</button>
                </template>
                <template x-if="editingName === g.name">
                  <button class="btn btn-primary" type="button" @click="saveEdit(g.name)" :disabled="!editValue.trim()">저장</button>
                </template>
                <template x-if="editingName === g.name">
                  <button class="btn" type="button" @click="cancelEdit()">취소</button>
                </template>
                <button class="btn btn-danger" type="button" @click="remove(g)" title="삭제">🗑</button>
              </span>
            </li>
          </template>
        </ul>
        <p class="error-text" x-show="error" x-text="error"></p>
      </div>
    </main>
  </div>
</body>
</html>
